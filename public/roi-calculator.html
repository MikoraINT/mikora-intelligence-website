    el(aside,"span","pp-strip-k","What you get at the end");
    var ul=el(aside,"ul");
    PAYOFF.forEach(function(t){ el(ul,"li",null,t); });
  }

  function head(n,q,hint,bgkey,nudge){
    var host=openStage(bgkey);
    var b=el(host,"div","pp-bar"); el(b,"i").style.width=((n-1)/TOTAL*100)+"%";
    el(host,"p","pp-step-no","Step "+n+" of "+TOTAL);
    el(host,"h2","pp-q",q);
    if(hint) el(host,"p","pp-hint",hint);
    strip(nudge);
    return host;
  }
  function nav(back,next,enabled){
    var r=el(stage.firstChild,"div","pp-row");
    if(back){var b=el(r,"button","pp-back","Back");b.type="button";b.onclick=back;}
    if(next){var n=el(r,"button","pp-btn","Continue");n.type="button";n.disabled=!enabled;n.onclick=next;}
  }
  function opt(parent,title,meta,sel,fn){
    var b=el(parent,"button","pp-opt"+(sel?" pp-sel":""));b.type="button";
    el(b,"b",null,title); if(meta) el(b,"span",null,meta);
    b.onclick=fn; return b;
  }

  function render(){
    root.innerHTML="";
    if(S.card) return renderResult();
    switch(S.step){
      case 0: return step0();
      case 1: return step1(); case 2: return step2(); case 3: return step3();
      case 4: return step4(); case 5: return step5(); case 6: return step6();
      case 7: return step7();
    }
  }

  var LOGO="https://www.plasmapen.com/wp-content/uploads/2025/09/plasmapen-logo.svg";
  // Swap this for a plasmapen.com media-library URL once the image is uploaded there.
  var HERO="https://mtwuuuuxpykqqkktmwba.supabase.co/storage/v1/object/public/mikora-images/hero_fusion.jpg";

  function band(label){
    var b=el(root,"div","pp-band");
    b.style.background='#000 url("'+HERO+'") right center/cover no-repeat';
    b.style.position="relative";
    var ov=document.createElement("div");
    ov.style.cssText="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.6) 70%,rgba(0,0,0,.25));border-radius:14px";
    b.appendChild(ov);
    var wrap=document.createElement("div"); wrap.style.position="relative"; b.appendChild(wrap);
    b=wrap;
    var img=document.createElement("img");
    img.src=LOGO; img.alt="Plasma Pen"; img.loading="lazy";
    b.appendChild(img);
    if(label) el(b,"p","pp-eyebrow",label);
  }

  function step0(){
    var hero=document.createElement("div"); hero.className="pp-hero-full";
    root.appendChild(hero);
    var inner=el(hero,"div","pp-hero-in");
    var lg=document.createElement("img"); lg.className="pp-logo"; lg.src=LOGO; lg.alt="Plasma Pen";
    inner.appendChild(lg);
    el(inner,"div","pp-pill","Device ROI Calculator");
    el(inner,"h1",null,"What could a plasma device earn your clinic?");
    el(inner,"p","pp-hlead","Answer seven short questions and see how many treatments it takes to cover the device, what year one could look like, and how that changes as demand builds. Built on Plasma Pen’s own device pricing.");
    var b=el(inner,"button","pp-btn-light","Start the calculator"); b.type="button";
    b.onclick=function(){S.step=1;render();window.scrollTo({top:0,behavior:"smooth"});};
    el(inner,"p","pp-hero-note","Estimates only. They are not guaranteed income and do not include premises, staffing or other overheads.");

    var g=el(root,"div","pp-points");
    [["About a minute","Seven questions. No sign-up to see your numbers."],
     ["Your figures, not ours","You set the treatment price and how busy you expect to be."],
     ["Three levels of demand","See a cautious start and a confident one, side by side."]
    ].forEach(function(p){
      var box=el(g,"div","pp-point"); el(box,"b",null,p[0]); el(box,"span",null,p[1]);
    });
  }

  function step1(){ var host=head(1,"Where are you based?","So we show the right currency and device pricing.","country","<b>Prices are local.</b> Device pricing differs by region. Choosing your country keeps every figure you see in your own currency, at the price you would actually pay.");
    var g=el(host,"div","pp-grid");
    Object.keys(CURRENCIES).forEach(function(c){
      opt(g,CURRENCIES[c].label,CURRENCIES[c].symbol+" "+c,S.currency===c,function(){S.currency=c;S.step=2;render();});
    });
    nav(function(){S.step=0;render();},null,false);
  }
  function step2(){ var host=head(2,"Which device family interests you?","Pick the range you are considering.","family","<b>Not sure yet?</b> Hot plasma is the lifting and tightening work. Cold plasma is skin health and recovery. Fusion covers both on one console — pick the closest and you can always talk it through with the team afterwards.");
    var g=el(host,"div","pp-grid");
    Object.keys(DEVICE_FAMILIES).forEach(function(f){
      opt(g,DEVICE_FAMILIES[f].name,DEVICE_FAMILIES[f].desc,S.device_family===f,function(){
        S.device_family=f;S.device_key=null;S.treatment_focus=null;S.step=3;render();});
    });
    nav(function(){S.step=1;render();},null,false);
  }
  function step3(){ var host=head(3,"Which device?","Device prices exclude VAT.",S.device_family,"<b>Room to grow.</b> Every device in a range performs the same core treatments. Stepping up mainly buys speed, a wider protocol list and more capacity as you get busier.");
    var g=el(host,"div","pp-grid");
    Object.keys(DEVICE_CONFIG).forEach(function(k){
      var d=DEVICE_CONFIG[k]; if(d.family!==S.device_family) return;
      opt(g,d.display_name,money(d.cost[S.currency])+" device cost",S.device_key===k,function(){
        S.device_key=k;S.device_display_name=d.display_name;S.step=4;render();});
    });
    nav(function(){S.step=2;render();},null,false);
  }
  function step4(){ var host=head(4,"What will you focus on?","This helps the team send relevant follow-up.","focus","<b>This shapes your diary.</b> What you focus on decides which treatments you will be booking week to week, and that is what drives how quickly a device pays for itself.");
    var g=el(host,"div","pp-grid");
    (TREATMENT_FOCUS[S.device_family]||[]).forEach(function(f){
      opt(g,f.label,f.hint,S.treatment_focus===f.value,function(){S.treatment_focus=f.value;S.step=5;render();});
    });
    nav(function(){S.step=3;render();},null,false);
  }
  function step5(){ var host=head(5,"What will you charge per treatment?","Your own price. Most clinics land between "+money(150)+" and "+money(400)+".","price","<b>Your price, not ours.</b> Use what you would genuinely charge in your area, not a national average. Every figure on the next screen is built on this one number, so it is worth being honest with yourself here.");
    var f=el(host,"div","pp-field"); el(f,"span",null,sym());
    var i=el(f,"input"); i.type="number"; i.min="1"; i.inputMode="decimal"; i.placeholder="200";
    if(S.treatment_price) i.value=S.treatment_price;
    var err=el(host,"div","pp-err","");
    function go(){ var v=parseFloat(i.value);
      if(!isFinite(v)||v<=0){err.textContent="Please enter a price above zero.";return;}
      S.treatment_price=v;S.step=6;render(); }
    i.oninput=function(){err.textContent="";};
    i.onkeydown=function(e){if(e.key==="Enter")go();};
    nav(function(){S.step=4;render();},go,true);
    setTimeout(function(){i.focus();},30);
  }
  function step6(){ var host=head(6,"How many treatments a week?","A realistic starting number, not a best case.","volume","<b>Start small.</b> One or two a week is a steady place to begin, and it moves the numbers further than most people expect — you will see what building beyond that looks like in a moment.");
    var f=el(host,"div","pp-field");
    var i=el(f,"input"); i.type="number"; i.min="1"; i.inputMode="numeric"; i.placeholder="2";
    if(S.treatments_per_week) i.value=S.treatments_per_week;
    el(f,"span",null,"a week");
    var err=el(host,"div","pp-err","");
    function go(){ var v=parseFloat(i.value);
      if(!isFinite(v)||v<=0){err.textContent="Please enter a number above zero.";return;}
      S.treatments_per_week=v;S.step=7;render(); }
    i.oninput=function(){err.textContent="";};
    i.onkeydown=function(e){if(e.key==="Enter")go();};
    nav(function(){S.step=5;render();},go,true);
    setTimeout(function(){i.focus();},30);
  }
  function step7(){ var host=head(7,"How should we model demand?","You will see all three either way.","scenario","<b>No wrong answer.</b> Pick the one that matches how confident you feel today. You will see all three side by side regardless, because a range is far more useful than a single number.");
    var g=el(host,"div","pp-grid");
    SCENARIOS.forEach(function(s){
      opt(g,s.name,s.desc,S.scenario===s.value,function(){S.scenario=s.value;submit();});
    });
    nav(function(){S.step=6;render();},null,false);
  }

  function submit(){
    root.innerHTML="";
    var l=el(root,"div","pp-load"); el(l,"div","pp-spin"); el(l,"div",null,"Working out your numbers\u2026");
    var payload={message:"ROI calculator submitted",session_id:sid,visitor_id:vid,
      widget_event:"roi_calculator_opened",email:S.email||null,full_name:S.full_name||null,
      roi_state:{active:true,device_key:S.device_key,device_display_name:S.device_display_name,
        device_family:S.device_family,currency:S.currency,treatment_focus:S.treatment_focus,
        treatment_price:S.treatment_price,treatments_per_week:S.treatments_per_week,
        scenario:S.scenario,inputs_complete:true,last_question_asked:null,
        email:S.email||null,full_name:S.full_name||null},
      roi_submission:true,landing_page:location.href,page_url:location.href,
      page_title:document.title,referrer:document.referrer||"",
      channel:"website_chat",platform:"website"};
    Object.keys(UTM).forEach(function(k){payload[k]=UTM[k];});
    fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(function(r){return r.text();})
      .then(function(t){var d;try{d=JSON.parse(t);}catch(e){d={};}
        if(Array.isArray(d)) d=d[0]||{};
        if(d&&d.roi_card){S.card=d.roi_card;render();}
        else {fail();}})
      .catch(fail);
  }
  function fail(){
    root.innerHTML="";
    el(root,"h1",null,"We could not work that out just now");
    el(root,"p","pp-lead","Something went wrong at our end, not yours. Please try again, or speak to the team and they will run the numbers with you.");
    var r=el(root,"div","pp-row");
    var b=el(r,"button","pp-btn","Try again"); b.type="button"; b.onclick=function(){S.card=null;S.step=7;render();};
    var a=document.createElement("a"); a.className="pp-back"; a.href=CAL; a.textContent="Speak to the team"; r.appendChild(a);
  }

  var CAL="https://calendly.com/lynneelms/introductory-call";
  // Established PlasmaPen CTA pair; the prefilled text tells the team where it came from.
  var WA="https://wa.me/441704579800?text="+encodeURIComponent(
    "Hi, I just used the ROI calculator on your website and I would like to talk it through.");

  function renderResult(){
    var c=S.card, be=c.break_even||{}, yr=c.yearly||{}, pt=c.per_treatment||{}, ins=c.inputs_summary||{};
    band("Your projection");
    el(root,"h1",null,"Here are your numbers");
    el(root,"p","pp-lead",(c.device_name||"Your device")+", at "+money(ins.treatment_price)+" a treatment and "+
      (ins.treatments_per_week||0)+" a week.");

    var hero=el(root,"div","pp-hero");
    el(hero,"div","pp-k","Pays for itself after");
    el(hero,"div","pp-v",(be.treatments||0)+" treatments");
    el(hero,"div","pp-n","That figure does not change. What changes is how fast you get there.");

    // The server returns the chosen scenario only. The three scenarios are derived
    // here with exactly the multipliers the ROI email uses (0.70 / 1.00 / 1.30,
    // 4.33 weeks a month, 52 a year) so the page and the email can never disagree.
    var WPM=4.33, WPY=52;
    var perWeek=Number(ins.treatments_per_week)||0;
    var profitEach=Number(pt.gross_profit)||0;
    var beTreat=Number(be.treatments)||0;
    var rows=SCENARIOS.map(function(s){
      var weekly=perWeek*s.mult;
      var monthly=weekly*WPM;
      return {name:s.name, chosen:(s.value===S.scenario),
        months:(beTreat&&monthly>0)?(beTreat/monthly):null,
        yearOne:weekly*WPY*profitEach,
        sessions:Math.round(weekly*WPY)};
    });
    var cards=el(root,"div","pp-cards");
    rows.forEach(function(r){
      var box=el(cards,"div","pp-card"+(r.chosen?" pp-chosen":""));
      el(box,"div","pp-k",r.name.toUpperCase()+(r.chosen?" \u00b7 CHOSEN":""));
      var big=el(box,"div","pp-big",r.months!=null?r.months.toFixed(1):"\u2014");
      el(big,"span","pp-unit"," months to pay back");
      el(box,"p",null,"About "+r.sessions+" treatments in year one, around "+money(r.yearOne)+" gross profit.");
    });
    var fastest=rows[rows.length-1].months, slowest=rows[0].months;
    if(fastest!=null&&slowest!=null)
      el(root,"p","pp-hint","Between "+fastest.toFixed(1)+" and "+slowest.toFixed(1)+" months depending on how demand builds.");

    var t=el(root,"table","pp-tbl");
    function row(k,v){var tr=el(t,"tr");el(tr,"td",null,k);el(tr,"td",null,v);}
    row("Your treatment price",money(ins.treatment_price));
    row("Consumable cost","\u2212"+money(ins.consumable_cost));
    row("Gross profit per treatment",money(pt.gross_profit));
    if(pt.gross_margin_pct!=null) row("Gross margin",pt.gross_margin_pct+"%");
    if(yr.gross_profit!=null) row("Year one gross profit",money(yr.gross_profit));

    if(!S.sent) emailBlock(); else {
      var s=el(root,"div","pp-sent");
      s.textContent="Sent. The full breakdown is on its way to "+S.email+", including all three scenarios and finance options.";
    }

    var n=el(root,"div","pp-note");
    n.textContent=c.disclaimer||"These are illustrative gross profit estimates based on the figures you entered. They are not guaranteed income and do not include premises, staffing or other overheads.";

    var cta=el(root,"div","pp-cta");
    var a=document.createElement("a"); a.href=CAL; a.textContent="Talk the numbers through \u2192"; cta.appendChild(a);

    // Second channel only once the lead is captured, never mid-flow.
    var alt=el(root,"div","pp-cta-alt");
    var w=document.createElement("a"); w.href=WA; w.target="_blank"; w.rel="noopener";
    w.textContent="Prefer WhatsApp? Message the team \u2192"; alt.appendChild(w);

    var again=el(root,"div","pp-row");
    var b=el(again,"button","pp-back","Start again"); b.type="button";
    b.onclick=function(){S.card=null;S.sent=false;S.step=1;render();};
  }

  function emailBlock(){
    var w=el(root,"div","pp-card");
    el(w,"div","pp-k","Want the full breakdown?");
    el(w,"p",null,"We will email you all three scenarios side by side, plus monthly finance options for this device. No obligation.");
    var nf=el(w,"div","pp-field"); nf.style.marginTop="12px";
    var ni=el(nf,"input"); ni.type="text"; ni.placeholder="Your name"; ni.autocomplete="name";
    var ef=el(w,"div","pp-field"); ef.style.marginTop="8px";
    var ei=el(ef,"input"); ei.type="email"; ei.placeholder="you@yourclinic.com"; ei.autocomplete="email";
    var err=el(w,"div","pp-err","");
    var r=el(w,"div","pp-row");
    var b=el(r,"button","pp-btn","Email me the breakdown"); b.type="button";
    b.onclick=function(){
      var em=(ei.value||"").trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){err.textContent="Please enter a valid email address.";return;}
      S.email=em; S.full_name=(ni.value||"").trim();
      b.disabled=true; b.textContent="Sending\u2026";
      var p={message:"ROI calculator submitted",session_id:sid,visitor_id:vid,
        widget_event:"roi_calculator_opened",email:S.email,full_name:S.full_name,
        roi_state:{active:true,device_key:S.device_key,device_display_name:S.device_display_name,
          device_family:S.device_family,currency:S.currency,treatment_focus:S.treatment_focus,
          treatment_price:S.treatment_price,treatments_per_week:S.treatments_per_week,
          scenario:S.scenario,inputs_complete:true,last_question_asked:null,
          email:S.email,full_name:S.full_name},
        roi_submission:true,landing_page:location.href,page_url:location.href,
        page_title:document.title,referrer:document.referrer||"",
        channel:"website_chat",platform:"website"};
      Object.keys(UTM).forEach(function(k){p[k]=UTM[k];});
      fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)})
        .then(function(){S.sent=true;
          try{window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:"mikora_roi_completed",
            mikora_device:S.device_display_name||null,mikora_currency:S.currency||null});}catch(e){}
          render();})
        .catch(function(){err.textContent="That did not send. Please try again.";b.disabled=false;b.textContent="Email me the breakdown";});
    };
    el(w,"p","pp-small","We will use your details to send this breakdown and follow up about the device. You can ask us to stop at any time.");
  }

  render();
})();
</script>
</body></html>
